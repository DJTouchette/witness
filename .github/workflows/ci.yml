name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Called out before the full run, and named, because these are the only
      # tests that drive the real binary against real repositories: when one of
      # them goes red, witness has started reporting a selection it cannot
      # back up, and that should be obvious from the job list alone. `go test
      # ./...` below runs them again as part of the suite.
      - name: End-to-end golden tests
        run: go test ./internal/e2e -count=1

      - name: Test
        run: go test ./... -count=1

      # Separate pass: the plain run above still gates the build if the race
      # detector trips on something unrelated to correctness.
      - name: Test (race)
        run: go test -race ./... -count=1
